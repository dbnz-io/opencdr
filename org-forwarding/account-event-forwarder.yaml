AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Legacy central-organization forwarder. For new installations, deploy
  OpenCDR Core in each account and use account-local regional collectors.
  This template remains for compatibility with existing central deployments.

Parameters:
  ServiceName:
    Type: String
    Default: opencdr
  Stage:
    Type: String
    Default: dev
  CentralEventBusArn:
    Type: String
    Description: >
      The central security account's default event bus ARN -- the
      `DefaultEventBusArn` output from that account's serverless.yml
      stack (deployed there with a non-empty `orgId` param).

Resources:
  AccountForwarderRole:
    Type: AWS::IAM::Role
    Properties:
      # Must match exactly what the central account's OrgForwarderBusPolicy
      # trusts (arn:aws:iam::*:role/${ServiceName}-${Stage}-account-forwarder-role)
      # -- this is the whole mechanism, not just a naming convention.
      RoleName: !Sub "${ServiceName}-${Stage}-account-forwarder-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: put-events-to-central-bus
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Ref CentralEventBusArn

  ForwardingRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ServiceName}-${Stage}-account-forwarder"
      Description: !Sub "Forwards this account's CloudTrail/GuardDuty events to ${CentralEventBusArn}"
      EventBusName: default
      State: ENABLED
      EventPattern:
        source:
          - "aws.guardduty"
          - "aws.signin"
          - "aws.iam"
          - "aws.sts"
          - "aws.lambda"
          - "aws.ec2"
          - "aws.cloudtrail"
          - "aws.config"
          - "aws.securityhub"
          - "aws.secretsmanager"
          - "aws.ssm"
          - "aws.s3"
          - "aws.rds"
        detail-type:
          - "GuardDuty Finding"
          - "AWS API Call via CloudTrail"
          - "AWS Console Sign In via CloudTrail"
      Targets:
        - Id: CentralSecurityAccountBus
          Arn: !Ref CentralEventBusArn
          RoleArn: !GetAtt AccountForwarderRole.Arn

Outputs:
  AccountForwarderRoleArn:
    Value: !GetAtt AccountForwarderRole.Arn
  ForwardingRuleArn:
    Value: !GetAtt ForwardingRule.Arn

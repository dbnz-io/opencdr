service: opencdr
frameworkVersion: "4"

params:
  default:
    alarmEmail: ""
    alertEmail: ""  # email for security detection alerts; can match alarmEmail
    monthlyBudgetUsd: "50"  # threshold for the AWS Budgets cost alert -- override with --param="monthlyBudgetUsd=<amount>"
    orgId: ""  # your AWS Organization ID (o-xxxxxxxxxx) -- only set this for an org-wide deployment, see docs/org-forwarding.md

package:
  patterns:
    - src/openapi/swagger.json

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  logRetentionInDays: 90

  # Cost-allocation tags -- stackTags tags the CloudFormation stack itself
  # (visible in the CFN console); tags applies to every Lambda function
  # this service creates. Every other taggable resource (DynamoDB tables,
  # SQS queues, SNS topics) is tagged explicitly on its own Properties
  # below, since CloudFormation does not cascade stack-level tags down to
  # child resources on its own. These tag keys/values must still be
  # activated as cost allocation tags once in Billing preferences (a
  # console/API step outside CloudFormation) before Cost Explorer can
  # filter by them -- see scripts/cost_report.sh.
  stackTags:
    Project: opencdr
    Stage: ${self:provider.stage}
  tags:
    Project: opencdr
    Stage: ${self:provider.stage}

  # AWS-native tracing (replaces the Phase 6 OTel/Sentry attempt, which hit
  # a real bug in a third-party instrumentor's API Gateway event handling --
  # AwsLambdaInstrumentor's attribute-extraction ran outside any exception
  # handling and threw on this repo's actual event shape, causing api.py to
  # 502 on every request). No app code, no third-party instrumentation
  # library, no bug surface to inherit -- this sets TracingConfig: Active
  # on every function and turns on X-Ray tracing on the API Gateway stage.
  # The IAM permission this needs is added explicitly per function below
  # rather than relied on to merge automatically, since this repo builds a
  # separate role per function (provider.iam.role.mode: perFunction,
  # below) instead of using the framework's single default role that this
  # setting normally grants the permission to.
  tracing:
    lambda: true
    apiGateway: true

  # Native per-function IAM roles (v4+) -- replaces the third-party
  # serverless-iam-roles-per-function plugin, which was last published in
  # 2021 with no confirmed v4 support. Every function's iamRoleStatements:
  # block below is unchanged; this just switches who reads it.
  iam:
    role:
      mode: perFunction

  apiGateway:
    apiKeys:
      # Bare name (no suffix) = full access, back-compat with the key
      # already deployed before route-level scoping existed (src/handlers/
      # api.py's _scopes_from_key_name). Suffixed keys are scoped to just
      # the dash-joined scopes in their name -- see docs/api-reference.md's
      # "API key scopes" section before adding more. The second key here
      # carries all five scopes (mcp_server/ is the default OpenCDR
      # management plane and needs to reach every route) but is still a
      # separate, independently revocable key from the bare one above.
      - opencdrPlan:
          - ${self:service}-${self:provider.stage}-api-key
          - ${self:service}-${self:provider.stage}-api-key-read-rules-settings-ir_roles-ir_actions
    usagePlan:
      - opencdrPlan:
          quota:
            limit: 10000
            period: MONTH
          throttle:
            burstLimit: 200
            rateLimit: 100

  environment:
    STAGE: "${self:provider.stage}"

    # Tables
    # SIGNALS_TABLE_NAME/LOGS_TABLE_NAME point at the -v2, composite-key
    # tables (see the SIGNALS TABLE V2 comment in resources: below) --
    # every write path (processor/alerter via signal_writer.py,
    # logger.py) and api.py's read path both use these. The original
    # bare severity/service-keyed tables this migration replaced have
    # since been fully decommissioned.
    SIGNALS_TABLE_NAME: "${self:service}-${self:provider.stage}-signals-table-v2"
    ALERTS_TABLE_NAME: "${self:service}-${self:provider.stage}-alerts-table"
    SETTINGS_TABLE_NAME: "${self:service}-${self:provider.stage}-settings-table"
    LOGS_TABLE_NAME: "${self:service}-${self:provider.stage}-logs-table-v2"
    DETECTION_RULES_TABLE_NAME: "${self:service}-${self:provider.stage}-detection-rules-table"
    OUTBOX_TABLE_NAME: "${self:service}-${self:provider.stage}-outbox-table"
    IR_ACCOUNT_ROLES_TABLE_NAME: "${self:service}-${self:provider.stage}-ir-account-roles-table"

    # Queues
    NOTIFICATIONS_QUEUE_URL:
      Ref: NotificationsQueue
    RESPONSES_QUEUE_URL:
      Ref: ResponsesQueue

    # Correlation tuning (optional)
    CORRELATION_QUERY_LIMIT: ${env:CORRELATION_QUERY_LIMIT, '300'}

    # Archival / retention tuning (optional) -- see docs/data-archival.md
    DYNAMODB_TTL_DAYS: ${env:DYNAMODB_TTL_DAYS, '90'}
    # Unset (default) = store every log line in DynamoDB, same as before
    # archival existed. Set to INFO/WARNING/ERROR to only persist that
    # level and above -- CloudWatch still gets everything regardless, and
    # so does the S3 archive (this only narrows what GET /logs can query
    # live).
    LOGS_MIN_LEVEL_TO_STORE: ${env:LOGS_MIN_LEVEL_TO_STORE, ''}


functions:

  # -------------------------
  # Processor → parses + detects → writes signals
  # -------------------------
  processor:
    handler: src.handlers.processor.lambda_handler
    environment:
      SERVICE_NAME: "OPENCDR-PROCESSOR"
      LAMBDA_NAME: "${self:service}-${self:provider.stage}-processor"
      SIGNALS_WRITE_QUEUE_URL: !Ref SignalsWriteQueue
      ALERTS_TABLE_NAME: "${self:service}-${self:provider.stage}-alerts-table"
      OUTBOX_TABLE_NAME: "${self:service}-${self:provider.stage}-outbox-table"
      DETECTION_RULES_TABLE_NAME: "${self:service}-${self:provider.stage}-detection-rules-table"
      LOGS_TABLE_NAME: "${self:service}-${self:provider.stage}-logs-table-v2"
    iamRoleStatements:
      # No more signals-table resources here -- see SIGNALS TABLE V2
      # comment above; processor now enqueues instead of writing
      # directly. detection-rules-table/logs-table PutItem stays (the
      # latter is every function's own Logger writing log_item).
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:GetItem
          - dynamodb:Query
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-detection-rules-table
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-logs-table-v2
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-alerts-table
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-outbox-table
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource:
          - Fn::GetAtt: [SignalsWriteQueue, Arn]
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource:
          - Fn::GetAtt: [SignalsWriteQueue, Arn]
      # X-Ray write actions don't support resource-level scoping.
      - Effect: Allow
        Action:
          - xray:PutTraceSegments
          - xray:PutTelemetryRecords
        Resource: "*"
    events:

      # ── GuardDuty findings ─────────────────────────────────────────────
      # Catches all GuardDuty threat intelligence findings
      - eventBridge:
          pattern:
            source:
              - "aws.guardduty"
            detail-type:
              - "GuardDuty Finding"

      # ── CloudTrail — important API calls ──────────────────────────────
      # Covers all services with active detection rules.
      # aws.signin  → console login (rules 001–003)
      # aws.iam     → users, roles, keys, policies (rules 004–010)
      # aws.sts     → AssumeRole, federation
      # aws.lambda  → function creation with privileged roles (rule 008)
      # aws.ec2     → security group changes (rule 011)
      # aws.cloudtrail  → trail tampering (rule 012)
      # aws.config      → Config recorder disabled (rule 014)
      # aws.securityhub → SecurityHub disabled (rule 015)
      # aws.secretsmanager → secrets access (rule 016)
      # aws.ssm         → SSM parameter access (rule 017)
      # aws.s3          → bucket ACL/policy changes (rule 018)
      # aws.rds         → snapshot made public (rule 019)
      - eventBridge:
          pattern:
            source:
              - "aws.signin"
              - "aws.iam"
              - "aws.sts"
              - "aws.lambda"
              - "aws.ec2"
              - "aws.cloudtrail"
              - "aws.config"
              - "aws.securityhub"
              - "aws.secretsmanager"
              - "aws.ssm"
              - "aws.s3"
              - "aws.rds"
            detail-type:
              - "AWS API Call via CloudTrail"
              - "AWS Console Sign In via CloudTrail"

  # -------------------------
  # Signal writer ← signals write queue → writes signals-table-v2
  # -------------------------
  # See serverless.yml's SIGNALS TABLE V2 / SQS — signals write buffer
  # comments above for why this exists: processor/alerter enqueue here
  # instead of writing directly, so a hot severity_bucket partition
  # throttles a retry, not a lost signal.
  signalWriter:
    handler: src.handlers.signal_writer.lambda_handler
    timeout: 25 # strictly under SQS's default 30s visibility timeout
    memorySize: 256
    environment:
      SERVICE_NAME: "OPENCDR-SIGNAL-WRITER"
      LAMBDA_NAME: "${self:service}-${self:provider.stage}-signal-writer"
      SIGNALS_TABLE_NAME: "${self:service}-${self:provider.stage}-signals-table-v2"
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-signals-table-v2
      - Effect: Allow
        Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [SignalsWriteQueue, Arn]
      # X-Ray write actions don't support resource-level scoping.
      - Effect: Allow
        Action:
          - xray:PutTraceSegments
          - xray:PutTelemetryRecords
        Resource: "*"
    events:
      - sqs:
          arn:
            Fn::GetAtt: [SignalsWriteQueue, Arn]
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  # -------------------------
  # Alerter ← signals stream → runs correlation → writes alerts + outbox
  # -------------------------
  alerter:
    handler: src.handlers.alerter.lambda_handler
    timeout: 30
    memorySize: 256
    environment:
      SERVICE_NAME: "OPENCDR-ALERTER"
      LAMBDA_NAME: "${self:service}-${self:provider.stage}-alerter"
      SIGNALS_TABLE_NAME: "${self:service}-${self:provider.stage}-signals-table-v2"
      SIGNALS_WRITE_QUEUE_URL: !Ref SignalsWriteQueue
      ALERTS_TABLE_NAME: "${self:service}-${self:provider.stage}-alerts-table"
      DETECTION_RULES_TABLE_NAME: "${self:service}-${self:provider.stage}-detection-rules-table"
      OUTBOX_TABLE_NAME: "${self:service}-${self:provider.stage}-outbox-table"
      LOGS_TABLE_NAME: "${self:service}-${self:provider.stage}-logs-table-v2"
      CORRELATION_QUERY_LIMIT: ${env:CORRELATION_QUERY_LIMIT, '300'}
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:GetItem
          - dynamodb:Query
          - dynamodb:UpdateItem
          - dynamodb:Scan
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-alerts-table
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-detection-rules-table
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-outbox-table
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-logs-table-v2
      # signals-table-v2 read access -- correlation lookback (alerter.py's
      # Query on gsi_signal_actor_user_name), SIGNALS_TABLE_NAME points
      # here now (see provider.environment above). No grant on the old
      # signals-table -- alerter no longer references it by name.
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:Query
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-signals-table-v2
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-signals-table-v2/index/*
      - Effect: Allow
        Action:
          - dynamodb:DescribeStream
          - dynamodb:GetRecords
          - dynamodb:GetShardIterator
          - dynamodb:ListStreams
        Resource:
          - Fn::GetAtt: [SignalsTableV2, StreamArn]
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource:
          - Fn::GetAtt: [StreamFailureQueue, Arn]
          - Fn::GetAtt: [SignalsWriteQueue, Arn]
      # X-Ray write actions don't support resource-level scoping.
      - Effect: Allow
        Action:
          - xray:PutTraceSegments
          - xray:PutTelemetryRecords
        Resource: "*"
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt: [SignalsTableV2, StreamArn]
          batchSize: 50
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          destinations:
            onFailure:
              arn:
                Fn::GetAtt: [StreamFailureQueue, Arn]
              type: sqs

  # -------------------------
  # Publisher ← outbox stream → sends to SQS and marks outbox
  # -------------------------
  publisher:
    handler: src.handlers.publisher.lambda_handler
    timeout: 30
    memorySize: 256
    environment:
      SERVICE_NAME: "OPENCDR-PUBLISHER"
      LAMBDA_NAME: "${self:service}-${self:provider.stage}-publisher"
      OUTBOX_TABLE_NAME: "${self:service}-${self:provider.stage}-outbox-table"
      LOGS_TABLE_NAME: "${self:service}-${self:provider.stage}-logs-table-v2"
      NOTIFICATIONS_QUEUE_URL:
        Ref: NotificationsQueue
      RESPONSES_QUEUE_URL:
        Ref: ResponsesQueue
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
          - dynamodb:PutItem
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-outbox-table
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-logs-table-v2
      - Effect: Allow
        Action:
          - dynamodb:DescribeStream
          - dynamodb:GetRecords
          - dynamodb:GetShardIterator
          - dynamodb:ListStreams
        Resource:
          - Fn::GetAtt: [OutboxTable, StreamArn]
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource:
          - Fn::GetAtt: [NotificationsQueue, Arn]
          - Fn::GetAtt: [ResponsesQueue, Arn]
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource:
          - Fn::GetAtt: [StreamFailureQueue, Arn]
      # X-Ray write actions don't support resource-level scoping.
      - Effect: Allow
        Action:
          - xray:PutTraceSegments
          - xray:PutTelemetryRecords
        Resource: "*"
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt: [OutboxTable, StreamArn]
          batchSize: 50
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          destinations:
            onFailure:
              arn:
                Fn::GetAtt: [StreamFailureQueue, Arn]
              type: sqs

  # -------------------------
  # Notifier → webhook delivery (Slack / Discord / Email)
  # -------------------------
  notifier:
    handler: src.handlers.notifier.lambda_handler
    environment:
      SERVICE_NAME: "OPENCDR-NOTIFIER"
      LAMBDA_NAME: "${self:service}-${self:provider.stage}-notifier"
      LOGS_TABLE_NAME: "${self:service}-${self:provider.stage}-logs-table-v2"
      ALERTS_SNS_TOPIC_ARN: !Ref AlertsSnsTopic
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:Query
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-settings-table
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-logs-table-v2
      # Resolves settings secrets (Slack/Discord/Jira, webhook headers)
      # stored as `ssm:` references -- see src/domain/settings_secrets.py
      - Effect: Allow
        Action:
          - ssm:GetParameter
        Resource:
          - arn:aws:ssm:${self:provider.region}:*:parameter/opencdr-${self:provider.stage}/settings/*
      - Effect: Allow
        Action:
          - kms:Decrypt
        Resource: "*"
      - Effect: Allow
        Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [NotificationsQueue, Arn]
      - Effect: Allow
        Action:
          - sns:Publish
        Resource:
          - !Ref AlertsSnsTopic
      - Effect: Allow
        Action:
          - securityhub:BatchImportFindings
        Resource: "*"
      # X-Ray write actions don't support resource-level scoping.
      - Effect: Allow
        Action:
          - xray:PutTraceSegments
          - xray:PutTelemetryRecords
        Resource: "*"
    events:
      - sqs:
          arn:
            Fn::GetAtt: [NotificationsQueue, Arn]
          batchSize: 10

  # -------------------------
  # Responder → automated incident response
  # -------------------------
  responder:
    handler: src.handlers.responder.lambda_handler
    timeout: 30
    memorySize: 512
    environment:
      SERVICE_NAME: "OPENCDR-RESPONDER"
      LAMBDA_NAME: "${self:service}-${self:provider.stage}-incident-response"
      # v2 -- _recent_action_count()'s rate-limit circuit breaker queries
      # by service_bucket, which only exists on logs-table-v2.
      LOGS_TABLE_NAME: "${self:service}-${self:provider.stage}-logs-table-v2"
      OPENCDR_IR_ROLE_ARN:
        Fn::If:
          - HasIrRoleArnOverride
          - ${env:OPENCDR_IR_ROLE_ARN, ''}
          - Fn::GetAtt: [OpencdrIrRole, Arn]
      DREDGE_DRY_RUN: ${env:DREDGE_DRY_RUN, 'true'}
      RESPONDER_RATE_LIMIT_WINDOW_MINUTES: ${env:RESPONDER_RATE_LIMIT_WINDOW_MINUTES, '5'}
      RESPONDER_RATE_LIMIT_MAX_ACTIONS: ${env:RESPONDER_RATE_LIMIT_MAX_ACTIONS, '20'}
      IR_ACTIONS_TABLE_NAME: "${self:service}-${self:provider.stage}-ir-actions-table"
    iamRoleStatements:
      # Responder holds no destructive IAM/EC2/S3 permissions of its own --
      # every response module (see dredge.aws_ir.response, a pinned
      # dependency -- requirements.txt) acts
      # through an assumed role instead, resolved per detection's AWS
      # account (src/handlers/responder.py _resolve_role_arn): a row in
      # irAccountRolesTable if the account is onboarded, else
      # OPENCDR_IR_ROLE_ARN (the auto-created OpencdrIrRole below, unless
      # overridden). Every such role -- home account and additional
      # accounts alike -- must be named "${self:service}-${self:provider.stage}-ir-role"
      # (see docs/ir-role.md); that naming convention, not an exact ARN, is
      # what scopes this grant.
      - Effect: Allow
        Action:
          - sts:AssumeRole
        Resource:
          - arn:aws:iam::*:role/${self:service}-${self:provider.stage}-ir-role
      - Effect: Allow
        Action:
          - dynamodb:GetItem
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-ir-account-roles-table
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:Query
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-logs-table-v2
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-outbox-table
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-ir-actions-table
      - Effect: Allow
        Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [ResponsesQueue, Arn]
      # X-Ray write actions don't support resource-level scoping.
      - Effect: Allow
        Action:
          - xray:PutTraceSegments
          - xray:PutTelemetryRecords
        Resource: "*"
    events:
      - sqs:
          arn:
            Fn::GetAtt: [ResponsesQueue, Arn]
          batchSize: 10

  # -------------------------
  # ROLLBACK HANDLER -- undoes a prior rollback-eligible IR action. See
  # src/handlers/ir_rollback.py, ROLLBACK_MODULE_HANDLERS. A separate
  # Lambda rather than a second concern bolted onto responder's already-
  # busy hot path, matching this project's one-Lambda-per-responsibility
  # shape.
  # -------------------------
  rollbackHandler:
    handler: src.handlers.ir_rollback.lambda_handler
    timeout: 30
    memorySize: 512
    environment:
      # Deliberately its own SERVICE_NAME, not responder's -- see
      # ir_rollback.py's module docstring: gives rollbacks their own
      # circuit-breaker budget instead of sharing/competing with
      # responder's.
      SERVICE_NAME: "OPENCDR-IR-ROLLBACK"
      LAMBDA_NAME: "${self:service}-${self:provider.stage}-ir-rollback"
      LOGS_TABLE_NAME: "${self:service}-${self:provider.stage}-logs-table-v2"
      IR_ACTIONS_TABLE_NAME: "${self:service}-${self:provider.stage}-ir-actions-table"
      OUTBOX_TABLE_NAME: "${self:service}-${self:provider.stage}-outbox-table"
      DREDGE_DRY_RUN: ${env:DREDGE_DRY_RUN, 'true'}
    iamRoleStatements:
      # Same cross-account assume-role shape as responder -- role_arn comes
      # from the stored irActionsTable row, not resolved fresh.
      - Effect: Allow
        Action:
          - sts:AssumeRole
        Resource:
          - arn:aws:iam::*:role/${self:service}-${self:provider.stage}-ir-role
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-ir-actions-table
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:Query
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-logs-table-v2
      # Writes the "rollback_success" (purple) notification -- same
      # notifications-only outbox item shape responder.py's
      # _notify_remediation_success already uses, consumed by publisher ->
      # notifier like any other outbox row.
      - Effect: Allow
        Action:
          - dynamodb:PutItem
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-outbox-table
      - Effect: Allow
        Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [IrRollbackQueue, Arn]
      - Effect: Allow
        Action:
          - xray:PutTraceSegments
          - xray:PutTelemetryRecords
        Resource: "*"
    events:
      - sqs:
          arn:
            Fn::GetAtt: [IrRollbackQueue, Arn]
          batchSize: 10

  # -------------------------
  # API
  # -------------------------
  api:
    handler: src.handlers.api.lambda_handler
    # Default (AWS's 3s) isn't enough headroom for a worst-case
    # MAX_DATE_RANGE_DAYS-day fan-out of sequential per-day signals/logs
    # queries (see the day-bucket merge pagination in api.py) -- 25s
    # stays under API Gateway's 29s integration timeout.
    timeout: 25
    environment:
      SERVICE_NAME: "OPENCDR-API"
      LAMBDA_NAME: "${self:service}-${self:provider.stage}-api"
      IR_ACTIONS_TABLE_NAME: "${self:service}-${self:provider.stage}-ir-actions-table"
      IR_ROLLBACK_QUEUE_URL:
        Ref: IrRollbackQueue
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:GetItem
          - dynamodb:Query
          - dynamodb:Scan
          - dynamodb:DeleteItem
          - dynamodb:UpdateItem
        Resource:
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-signals-table-v2
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-signals-table-v2/index/*
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-logs-table-v2
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-logs-table-v2/index/*
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-alerts-table
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-detection-rules-table
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-settings-table
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-ir-account-roles-table
          - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-ir-actions-table
      # POST /ir-actions/{id}/rollback only ever enqueues -- the actual
      # rollback runs in rollbackHandler, consuming this same queue.
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource:
          - Fn::GetAtt: [IrRollbackQueue, Arn]
      # Writes/reads/deletes settings secrets indirected through SSM
      # Parameter Store instead of plaintext DynamoDB attributes -- see
      # src/domain/settings_secrets.py.
      - Effect: Allow
        Action:
          - ssm:PutParameter
          - ssm:GetParameter
          - ssm:DeleteParameter
          - ssm:DeleteParameters
        Resource:
          - arn:aws:ssm:${self:provider.region}:*:parameter/opencdr-${self:provider.stage}/settings/*
      - Effect: Allow
        Action:
          - kms:Encrypt
          - kms:Decrypt
          - kms:GenerateDataKey
        Resource: "*"
      # X-Ray write actions don't support resource-level scoping.
      - Effect: Allow
        Action:
          - xray:PutTraceSegments
          - xray:PutTelemetryRecords
        Resource: "*"
      # Route-level API key scoping (_get_key_scopes in api.py) resolves
      # the caller's key name via GetApiKey on every cold-cache request.
      # GET only -- this role never needs to create/modify keys, unlike
      # the CI deploy role's broader apigateway:* grant.
      - Effect: Allow
        Action:
          - apigateway:GET
        Resource:
          - arn:aws:apigateway:${self:provider.region}::/apikeys/*
    events:
      - http:
          path: help
          method: get
          private: true
          cors: true
      - http:
          path: status
          method: get
          private: true
          cors: true
      - http:
          path: signals
          method: get
          private: true
          cors: true
      - http:
          path: signals/stats
          method: get
          private: true
          cors: true
      - http:
          path: logs
          method: get
          private: true
          cors: true
      - http:
          path: rules
          method: get
          private: true
          cors: true
      - http:
          path: rules
          method: post
          private: true
          cors: true
      - http:
          path: rules/{rule_id}
          method: get
          private: true
          cors: true
      - http:
          path: rules/{rule_id}
          method: put
          private: true
          cors: true
      - http:
          path: rules/{rule_id}
          method: delete
          private: true
          cors: true
      - http:
          path: settings
          method: get
          private: true
          cors: true
      - http:
          path: settings
          method: post
          private: true
          cors: true
      - http:
          path: settings/{setting_id}
          method: get
          private: true
          cors: true
      - http:
          path: settings/{setting_id}
          method: put
          private: true
          cors: true
      - http:
          path: settings/{setting_id}
          method: delete
          private: true
          cors: true
      - http:
          path: ir-roles
          method: get
          private: true
          cors: true
      - http:
          path: ir-roles
          method: post
          private: true
          cors: true
      - http:
          path: ir-roles/{aws_account_id}
          method: get
          private: true
          cors: true
      - http:
          path: ir-roles/{aws_account_id}
          method: put
          private: true
          cors: true
      - http:
          path: ir-roles/{aws_account_id}
          method: delete
          private: true
          cors: true
      - http:
          path: ir-actions
          method: get
          private: true
          cors: true
      - http:
          path: ir-actions/{detection_id}
          method: get
          private: true
          cors: true
      - http:
          path: ir-actions/{detection_id}/rollback
          method: post
          private: true
          cors: true

  # -------------------------
  # Alarm notifier ← AlarmsSnsTopic → Slack
  # -------------------------
  # Forwards CloudWatch Alarm state-change notifications to Slack. The
  # alarms (Lambda errors per function, DLQ depth, stream iterator age)
  # already existed -- alarmEmail was never set in any deployment, so
  # AlarmsEmailSubscription's Condition (HasAlarmEmail) never created a
  # subscription, and every one of them had been firing into a topic with
  # zero subscribers. Reuses the same webhook already set up for Phase 5's
  # post-deploy notifier-reachability check, at a separate SSM path so this
  # infra-noise channel stays independent of the security-detection one
  # (channels.slack.webhook_url in the settings table).
  alarmNotifier:
    handler: src.handlers.alarm_notifier.lambda_handler
    environment:
      SERVICE_NAME: "OPENCDR-ALARM-NOTIFIER"
    iamRoleStatements:
      - Effect: Allow
        Action:
          - ssm:GetParameter
        Resource:
          - arn:aws:ssm:${self:provider.region}:*:parameter/opencdr-${self:provider.stage}/ops-alerts/*
      - Effect: Allow
        Action:
          - kms:Decrypt
        Resource: "*"
      # X-Ray write actions don't support resource-level scoping. This
      # function was missing this grant entirely (added alongside the
      # other 6 functions' tracing setup, this one wasn't) -- Active
      # Tracing was on but had no permission to actually emit segments.
      - Effect: Allow
        Action:
          - xray:PutTraceSegments
          - xray:PutTelemetryRecords
        Resource: "*"
    events:
      - sns:
          arn: !Ref AlarmsSnsTopic
          topicName: ${self:service}-${self:provider.stage}-alarms

  # -------------------------
  # Archiver ← signals/alerts/logs streams → S3 (Parquet), see docs/data-archival.md
  # -------------------------
  archiver:
    handler: src.handlers.archiver.lambda_handler
    timeout: 60
    memorySize: 256
    environment:
      SERVICE_NAME: "OPENCDR-ARCHIVER"
      LAMBDA_NAME: "${self:service}-${self:provider.stage}-archiver"
      SIGNALS_FIREHOSE_STREAM_NAME: !Ref ArchiveSignalsFirehose
      ALERTS_FIREHOSE_STREAM_NAME: !Ref ArchiveAlertsFirehose
      LOGS_FIREHOSE_STREAM_NAME: !Ref ArchiveLogsFirehose
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:DescribeStream
          - dynamodb:GetRecords
          - dynamodb:GetShardIterator
          - dynamodb:ListStreams
        Resource:
          - Fn::GetAtt: [alerts, StreamArn]
          - Fn::GetAtt: [SignalsTableV2, StreamArn]
          - Fn::GetAtt: [LogsTableV2, StreamArn]
      - Effect: Allow
        Action:
          - firehose:PutRecordBatch
        Resource:
          - !GetAtt ArchiveSignalsFirehose.Arn
          - !GetAtt ArchiveAlertsFirehose.Arn
          - !GetAtt ArchiveLogsFirehose.Arn
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource:
          - Fn::GetAtt: [StreamFailureQueue, Arn]
      # X-Ray write actions don't support resource-level scoping.
      - Effect: Allow
        Action:
          - xray:PutTraceSegments
          - xray:PutTelemetryRecords
        Resource: "*"
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt: [alerts, StreamArn]
          batchSize: 100
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          destinations:
            onFailure:
              arn:
                Fn::GetAtt: [StreamFailureQueue, Arn]
              type: sqs
      # _STREAM_ROUTES in src/handlers/archiver.py matches by substring
      # ("signals-table"/"logs-table" in event_source_arn), and
      # "signals-table-v2"/"logs-table-v2" both still contain those
      # substrings, so no code change was needed for these to route to
      # the same Firehose delivery streams the original tables used.
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt: [SignalsTableV2, StreamArn]
          batchSize: 100
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          destinations:
            onFailure:
              arn:
                Fn::GetAtt: [StreamFailureQueue, Arn]
              type: sqs
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt: [LogsTableV2, StreamArn]
          batchSize: 100
          startingPosition: LATEST
          bisectBatchOnFunctionError: true
          maximumRetryAttempts: 3
          destinations:
            onFailure:
              arn:
                Fn::GetAtt: [StreamFailureQueue, Arn]
              type: sqs


resources:
  Conditions:
    HasAlarmEmail: !Not
      - !Equals
        - "${param:alarmEmail}"
        - ""
    HasAlertEmail: !Not
      - !Equals
        - "${param:alertEmail}"
        - ""
    HasIrRoleArnOverride: !Not
      - !Equals
        - "${env:OPENCDR_IR_ROLE_ARN, ''}"
        - ""
    HasOrgId: !Not
      - !Equals
        - "${param:orgId}"
        - ""

  Resources:

    # -------------------------
    # ALERTS TABLE (correlation outputs)
    # -------------------------
    alerts:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-alerts-table
        BillingMode: PAY_PER_REQUEST
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: alert_key
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: S
        KeySchema:
          - AttributeName: alert_key
            KeyType: HASH
          - AttributeName: timestamp
            KeyType: RANGE
        StreamSpecification:
          StreamViewType: NEW_IMAGE
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true

    # -------------------------
    # OUTBOX TABLE (publisher pattern) + stream
    # -------------------------
    OutboxTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-outbox-table
        BillingMode: PAY_PER_REQUEST
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: outbox_id
            AttributeType: S
        KeySchema:
          - AttributeName: outbox_id
            KeyType: HASH
        StreamSpecification:
          StreamViewType: NEW_IMAGE
        # Not archived -- delivery-tracking data, not investigative
        # history (see docs/data-archival.md for what is and isn't
        # archived and why). Safe to just expire.
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true

    # -------------------------
    # SIGNALS TABLE V2 / LOGS TABLE V2 -- partition-key redesign
    # -------------------------
    # A bare severity/service HASH key (only 6/8 distinct values) meant
    # every write for one value funneled into a single DynamoDB
    # partition (~1,000 WCU ceiling, independent of PAY_PER_REQUEST).
    # Replaced with a composite, self-scaling day-bucketed key
    # (severity_bucket/service_bucket, computed by
    # src/infra/partition_keys.py's day_bucket_key() -- "HIGH#2026-08-12")
    # as a NEW attribute, never a rename: severity/service themselves
    # stay clean on every item, since archiver.py's flatten_signal/
    # flatten_log read them as opaque pass-through values into the
    # S3/Parquet archive (see docs/data-archival.md).
    #
    # "V2" naming is a leftover from the migration itself: this was
    # deployed alongside the original severity/service-keyed tables
    # (CFN forces delete-and-recreate on any KeySchema change, so an
    # in-place edit wasn't an option), which have since been fully
    # decommissioned after their TTL drained (or, for a dev/demo
    # environment, once real data loss wasn't a concern). Left named
    # SignalsTableV2/LogsTableV2 rather than renamed post-cleanup --
    # renaming a CFN logical ID forces the exact same delete-and-recreate
    # this whole design was built to avoid.
    SignalsTableV2:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-signals-table-v2
        BillingMode: PAY_PER_REQUEST
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: severity_bucket
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: S
          - AttributeName: event_id
            AttributeType: S
          - AttributeName: category
            AttributeType: S
          - AttributeName: actor_user_name
            AttributeType: S
        KeySchema:
          - AttributeName: severity_bucket
            KeyType: HASH
          - AttributeName: timestamp
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: gsi_signal_event_id
            KeySchema:
              - AttributeName: event_id
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: gsi_signal_category_id
            KeySchema:
              - AttributeName: category
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: gsi_signal_actor_user_name
            KeySchema:
              - AttributeName: actor_user_name
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_IMAGE
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true

    LogsTableV2:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-logs-table-v2
        BillingMode: PAY_PER_REQUEST
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: service_bucket
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: S
          - AttributeName: event_id
            AttributeType: S
          - AttributeName: event_name
            AttributeType: S
        KeySchema:
          - AttributeName: service_bucket
            KeyType: HASH
          - AttributeName: timestamp
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: gsi_logs_event_id
            KeySchema:
              - AttributeName: event_id
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: gsi_activity_name
            KeySchema:
              - AttributeName: event_name
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_IMAGE
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true

    # -------------------------
    # ARCHIVAL: signals/alerts/logs -> S3 (Parquet), Hive-partitioned
    # -------------------------
    # Why: the tables above now TTL at 90 days -- safe specifically
    # because every signal/alert/log is streamed here first via
    # DynamoDB Streams -> the archiver Lambda (functions.archiver) ->
    # Kinesis Data Firehose, converted to Parquet, and written under
    # account=<id>/year=<Y>/month=<M>/day=<D>/hour=<H>/ prefixes -- the
    # standard Hive/Athena-friendly partition scheme. Outbox is
    # deliberately not archived (delivery-tracking data, not
    # investigative history) -- it just expires. See
    # docs/data-archival.md for the full design, including why the Glue
    # schemas below are intentionally flat (a handful of useful scalar
    # columns + one raw_item JSON-string column) rather than modeling
    # the nested actor/network/api/resources shape as Parquet structs.
    ArchiveBucket:
      Type: AWS::S3::Bucket
      Properties:
        # !Sub, not a bare string: Serverless Framework resolves
        # ${self:...} at synth time (text pre-processing across the
        # whole template, including inside intrinsic functions like this
        # one), but it doesn't recognize AWS::AccountId as one of its own
        # variable sources -- as a bare, unwrapped string this silently
        # resolved to undefined/null, which is what actually broke the
        # first real deploy (CloudFormation's S3 handler crashed trying
        # to hash a null BucketName). Wrapping in !Sub leaves
        # AWS::AccountId for CloudFormation's own resolver, same pattern
        # already used correctly everywhere else in this file (e.g.
        # OrgForwarderBusPolicy's role ARN pattern below).
        BucketName: !Sub "${self:service}-${self:provider.stage}-archive-${AWS::AccountId}"
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    ArchiveGlueDatabase:
      Type: AWS::Glue::Database
      Properties:
        CatalogId: !Ref AWS::AccountId
        DatabaseInput:
          Name: ${self:service}_${self:provider.stage}_archive

    ArchiveSignalsGlueTable: &archiveGlueTableSignals
      Type: AWS::Glue::Table
      Properties:
        CatalogId: !Ref AWS::AccountId
        DatabaseName: !Ref ArchiveGlueDatabase
        TableInput:
          Name: signals
          TableType: EXTERNAL_TABLE
          Parameters: &archiveProjectionParamsSignals
            classification: parquet
            "projection.enabled": "true"
            "projection.account.type": "injected"
            "projection.year.type": "integer"
            "projection.year.range": "2025,2030"
            "projection.month.type": "integer"
            "projection.month.range": "1,12"
            "projection.month.digits": "2"
            "projection.day.type": "integer"
            "projection.day.range": "1,31"
            "projection.day.digits": "2"
            "projection.hour.type": "integer"
            "projection.hour.range": "0,23"
            "projection.hour.digits": "2"
            "storage.location.template": !Sub "s3://${ArchiveBucket}/signals/account=${!account}/year=${!year}/month=${!month}/day=${!day}/hour=${!hour}/"
          StorageDescriptor:
            Location: !Sub "s3://${ArchiveBucket}/signals/"
            InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
            OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
            SerdeInfo:
              SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
              Parameters:
                serialization.format: "1"
            Columns:
              - { Name: detection_id, Type: string }
              - { Name: event_id, Type: string }
              - { Name: rule_id, Type: string }
              - { Name: severity, Type: string }
              - { Name: timestamp, Type: string }
              - { Name: category, Type: string }
              - { Name: activity_name, Type: string }
              - { Name: cloud_account_id, Type: string }
              - { Name: cloud_region, Type: string }
              - { Name: source, Type: string }
              - { Name: actor_user_name, Type: string }
              - { Name: raw_item, Type: string }
          PartitionKeys:
            - { Name: account, Type: string }
            - { Name: year, Type: string }
            - { Name: month, Type: string }
            - { Name: day, Type: string }
            - { Name: hour, Type: string }

    ArchiveAlertsGlueTable:
      <<: *archiveGlueTableSignals
      Properties:
        CatalogId: !Ref AWS::AccountId
        DatabaseName: !Ref ArchiveGlueDatabase
        TableInput:
          Name: alerts
          TableType: EXTERNAL_TABLE
          Parameters:
            <<: *archiveProjectionParamsSignals
            "storage.location.template": !Sub "s3://${ArchiveBucket}/alerts/account=${!account}/year=${!year}/month=${!month}/day=${!day}/hour=${!hour}/"
          StorageDescriptor:
            Location: !Sub "s3://${ArchiveBucket}/alerts/"
            InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
            OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
            SerdeInfo:
              SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
              Parameters:
                serialization.format: "1"
            Columns:
              - { Name: alert_id, Type: string }
              - { Name: alert_key, Type: string }
              - { Name: rule_id, Type: string }
              - { Name: severity, Type: string }
              - { Name: timestamp, Type: string }
              - { Name: type, Type: string }
              - { Name: group_value, Type: string }
              - { Name: cloud_account_id, Type: string }
              - { Name: match_count, Type: int }
              - { Name: raw_item, Type: string }
          PartitionKeys:
            - { Name: account, Type: string }
            - { Name: year, Type: string }
            - { Name: month, Type: string }
            - { Name: day, Type: string }
            - { Name: hour, Type: string }

    ArchiveLogsGlueTable:
      <<: *archiveGlueTableSignals
      Properties:
        CatalogId: !Ref AWS::AccountId
        DatabaseName: !Ref ArchiveGlueDatabase
        TableInput:
          Name: logs
          TableType: EXTERNAL_TABLE
          Parameters:
            <<: *archiveProjectionParamsSignals
            "storage.location.template": !Sub "s3://${ArchiveBucket}/logs/account=${!account}/year=${!year}/month=${!month}/day=${!day}/hour=${!hour}/"
          StorageDescriptor:
            Location: !Sub "s3://${ArchiveBucket}/logs/"
            InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
            OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
            SerdeInfo:
              SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
              Parameters:
                serialization.format: "1"
            Columns:
              - { Name: log_id, Type: string }
              - { Name: event_id, Type: string }
              - { Name: event_name, Type: string }
              - { Name: event_type, Type: string }
              - { Name: service, Type: string }
              - { Name: source, Type: string }
              - { Name: timestamp, Type: string }
              - { Name: level, Type: string }
              - { Name: raw_item, Type: string }
          PartitionKeys:
            - { Name: account, Type: string }
            - { Name: year, Type: string }
            - { Name: month, Type: string }
            - { Name: day, Type: string }
            - { Name: hour, Type: string }

    ArchiveFirehoseRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-archive-firehose-role
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: firehose.amazonaws.com
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  "sts:ExternalId": !Ref AWS::AccountId
        Policies:
          - PolicyName: archive-firehose-policy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:AbortMultipartUpload
                    - s3:GetBucketLocation
                    - s3:GetObject
                    - s3:ListBucket
                    - s3:ListBucketMultipartUploads
                    - s3:PutObject
                  Resource:
                    - !GetAtt ArchiveBucket.Arn
                    - !Sub "${ArchiveBucket.Arn}/*"
                - Effect: Allow
                  Action:
                    - glue:GetTable
                    - glue:GetTableVersion
                    - glue:GetTableVersions
                  Resource:
                    - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                    - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${ArchiveGlueDatabase}"
                    - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${ArchiveGlueDatabase}/*"
                - Effect: Allow
                  Action:
                    - logs:PutLogEvents
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                  Resource:
                    - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/kinesisfirehose/*"

    ArchiveSignalsFirehose: &archiveFirehose
      Type: AWS::KinesisFirehose::DeliveryStream
      Properties:
        DeliveryStreamName: ${self:service}-${self:provider.stage}-archive-signals
        DeliveryStreamType: DirectPut
        ExtendedS3DestinationConfiguration:
          RoleARN: !GetAtt ArchiveFirehoseRole.Arn
          BucketARN: !GetAtt ArchiveBucket.Arn
          Prefix: "signals/account=!{partitionKeyFromQuery:account}/year=!{partitionKeyFromQuery:year}/month=!{partitionKeyFromQuery:month}/day=!{partitionKeyFromQuery:day}/hour=!{partitionKeyFromQuery:hour}/"
          ErrorOutputPrefix: "signals-errors/!{firehose:error-output-type}/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/"
          BufferingHints:
            SizeInMBs: 128
            IntervalInSeconds: 300
          CompressionFormat: UNCOMPRESSED
          DynamicPartitioningConfiguration:
            Enabled: true
            RetryOptions:
              DurationInSeconds: 300
          ProcessingConfiguration:
            Enabled: true

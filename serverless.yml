    # -------------------------
    # DETECTION RULES TABLE
    # -------------------------
    detectionRules:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-detection-rules-table
        BillingMode: PAY_PER_REQUEST
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: rule_kind
            AttributeType: S
          - AttributeName: rule_id
            AttributeType: S
        KeySchema:
          - AttributeName: rule_kind
            KeyType: HASH
          - AttributeName: rule_id
            KeyType: RANGE

    # -------------------------
    # SETTINGS TABLE
    # -------------------------
    globalSettingsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-settings-table
        BillingMode: PAY_PER_REQUEST
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: setting_id
            AttributeType: S
        KeySchema:
          - AttributeName: setting_id
            KeyType: HASH

    # -------------------------
    # IR ACCOUNT ROLES TABLE (account_id -> role_arn the responder assumes)
    # -------------------------
    irAccountRolesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-ir-account-roles-table
        BillingMode: PAY_PER_REQUEST
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: aws_account_id
            AttributeType: S
        KeySchema:
          - AttributeName: aws_account_id
            KeyType: HASH

    # One row per executed IR action that responder recognizes as
    # rollback-eligible (ROLLBACK_UNDO_MODULE in src/handlers/responder.py) --
    # detection_id is 1:1 with the row since responder only ever takes one
    # action per detection. rollbackHandler reads rollback_kwargs back out
    # to call the matching dredge undo function; rollback_supported is
    # false (row still written, for audit visibility) when the module
    # needed a prior-state capture that itself failed.
    irActionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-ir-actions-table
        BillingMode: PAY_PER_REQUEST
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: detection_id
            AttributeType: S
        KeySchema:
          - AttributeName: detection_id
            KeyType: HASH

    # -------------------------
    # IR ROLE for the home account (the account this stack deploys into).
    # Assumed by both responder (the original action) AND rollbackHandler
    # (the undo) -- both need to be trusted principals here, not just
    # responder. This role previously only trusted responder, which meant
    # a live deploy could execute an action just fine and still fail every
    # single rollback with a plain AccessDenied on sts:AssumeRole -- the
    # original action and its undo run as two separate Lambdas
    # (src/handlers/responder.py vs src/handlers/ir_rollback.py, see the
    # module docstring on ir_rollback.py for why they're split), each with
    # its own execution role, and both need to be trusted here
    # independently; granting sts:AssumeRole in a Lambda's own
    # iamRoleStatements (which both already had) only covers the caller
    # side of the check, not this role's trust policy, which is the other,
    # equally necessary half. See docs/ir-role.md.
    #
    # For additional (non-home) accounts, create this same role by hand
    # there (docs/ir-role.md has the trust + permissions JSON) and add a
    # row to irAccountRolesTable; a `serverless deploy` in one
    # account/region can't provision IAM roles in a different AWS account.
    #
    # Keep the Policies statements below in sync with
    # docs/ir-role-permissions.json -- same 6 statements, duplicated here
    # because CloudFormation has no clean way to include an external JSON
    # policy file.
    # -------------------------
    OpencdrIrRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-ir-role
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                AWS:
                  - Fn::GetAtt: [ResponderIamRoleLambdaExecution, Arn]
                  - Fn::GetAtt: [RollbackHandlerIamRoleLambdaExecution, Arn]
              Action: sts:AssumeRole
        Policies:
          - PolicyName: opencdr-ir-permissions
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: IamAccessKeys
                  Effect: Allow
                  Action:
                    - iam:ListAccessKeys
                    - iam:UpdateAccessKey
                    - iam:DeleteAccessKey
                  Resource: "arn:aws:iam::*:user/*"
                - Sid: IamUsers
                  Effect: Allow
                  Action:
                    - iam:ListGroupsForUser
                    - iam:RemoveUserFromGroup
                    - iam:DeleteLoginProfile
                    - iam:ListAttachedUserPolicies
                    - iam:DetachUserPolicy
                    - iam:ListUserPolicies
                    - iam:DeleteUserPolicy
                    - iam:DeleteUser
                    # revoke_active_sessions attaches a deny-all inline
                    # policy conditioned on aws:TokenIssueTime -- scoped
                    # to that one response module, not a general grant.
                    # Also doubles as restore_user's inline-policy restore.
                    - iam:PutUserPolicy
                    # disable_user captures each inline policy's document
                    # before deleting it (rollback_state for restore_user).
                    - iam:GetUserPolicy
                    # restore_user's undo for the managed-policy detach /
                    # group-removal steps disable_user already captured.
                    - iam:AttachUserPolicy
                    - iam:AddUserToGroup
                  Resource: "arn:aws:iam::*:user/*"
                # iam:UpdateAssumeRolePolicy deliberately NOT granted here even
                # though dredge's disable_role calls it (to clear a role's trust
                # policy) -- it's a full account-wide privilege-escalation
                # primitive (lets the holder rewrite ANY role's trust policy, not
                # just the one being contained), and disable_role already
                # detaches every managed policy + deletes every inline policy
                # first, which alone leaves the role assumable but harmless.
                # Losing the trust-policy-clear step is an accepted, narrow
                # trade-off -- it'll fail with AccessDenied and get logged, not
                # silently skipped. See docs/ir-role.md.
                - Sid: IamRoles
                  Effect: Allow
                  Action:
                    - iam:ListAttachedRolePolicies
                    - iam:DetachRolePolicy
                    - iam:ListRolePolicies
                    - iam:DeleteRolePolicy
                    # disable_role captures each inline policy's document
                    # before deleting it (rollback_state for restore_role).
                    - iam:GetRolePolicy
                    # restore_role's undo for the managed-policy-detach /
                    # inline-policy-delete steps above -- NOT trust policy,
                    # see the iam:UpdateAssumeRolePolicy comment above.
                    - iam:AttachRolePolicy
                    - iam:PutRolePolicy
                  Resource: "arn:aws:iam::*:role/*"
                - Sid: S3AccountPublicAccessBlock
                  Effect: Allow
                  Action:
                    - s3control:PutPublicAccessBlock
                    # GetPublicAccessBlock: block_s3_public_access captures
                    # prior state before mutating (rollback_state).
                    # DeletePublicAccessBlock: restore_s3_account_public_
                    # access_block's undo, when no PAB existed before.
                    - s3control:GetPublicAccessBlock
                    - s3control:DeletePublicAccessBlock
                  Resource: "*"
                - Sid: S3BucketContainment
                  Effect: Allow
                  Action:
                    - s3:PutBucketPublicAccessBlock
                    - s3:PutBucketAcl
                    - s3:DeleteBucketPolicy
                    # quarantine_s3_bucket attaches a deny-all bucket
                    # policy for principals outside the account -- scoped
                    # to that one response module, not a general grant.
                    - s3:PutBucketPolicy
                    # GetPublicAccessBlock/GetBucketAcl: block_s3_bucket_
                    # public_access captures prior state before mutating.
                    # DeletePublicAccessBlock: restore_s3_bucket_public_
                    # access_block_and_acl's undo, when no PAB existed
                    # before.
                    - s3:GetPublicAccessBlock
                    - s3:GetBucketAcl
                    - s3:DeletePublicAccessBlock
                    # quarantine_s3_bucket captures the prior bucket policy
                    # before overwriting it (rollback_state for
                    # restore_s3_bucket_quarantine) -- Put/DeleteBucketPolicy
                    # above already cover that undo's own write side.
                    - s3:GetBucketPolicy
                  Resource: "arn:aws:s3:::*"
                - Sid: S3ObjectContainment
                  Effect: Allow
                  Action:
                    - s3:PutObjectAcl
                    # block_s3_object_public_access captures the prior ACL
                    # before mutating (rollback_state for restore_s3_object_acl).
                    - s3:GetObjectAcl
                  Resource: "arn:aws:s3:::*/*"
                - Sid: Ec2Isolation
                  Effect: Allow
                  Action:
                    - ec2:DescribeInstances
                    - ec2:DescribeSecurityGroups
                    - ec2:CreateSecurityGroup
                    - ec2:RevokeSecurityGroupEgress
                    # deauthorize_security_group_rules (011_security_group_opened)
                    # revokes the specific ingress rule a CloudTrail event
                    # just added -- Ingress wasn't needed before this,
                    # only Egress (isolation SG cleanup).
                    - ec2:RevokeSecurityGroupIngress
                    - ec2:ModifyInstanceAttribute
                    # authorize_security_group_rules -- the undo for
                    # deauthorize_security_group_rules above, re-authorizing
                    # the exact rules that were revoked.
                    - ec2:AuthorizeSecurityGroupIngress
                    - ec2:AuthorizeSecurityGroupEgress
                  Resource: "*"
                - Sid: LambdaContainment
                  Effect: Allow
                  Action:
                    # disable_lambda_function (008_lambda_modified) throttles
                    # a function to zero reserved concurrency -- reversible,
                    # not a delete/disable of the function itself.
                    - lambda:PutFunctionConcurrency
                    # GetFunctionConcurrency: disable_lambda_function
                    # captures prior state before mutating (rollback_state).
                    # DeleteFunctionConcurrency: restore_lambda_concurrency's
                    # undo, when no reserved concurrency was set before.
                    - lambda:GetFunctionConcurrency
                    - lambda:DeleteFunctionConcurrency
                  Resource: "arn:aws:lambda:*:*:function:*"
                - Sid: SecretsManagerContainment
                  Effect: Allow
                  Action:
                    # disable_secrets_manager_secret (016_secretsmanager_accessed)
                    # schedules the secret for deletion (7-30 day recovery
                    # window, restorable via RestoreSecret during that
                    # window) -- not an instant, irreversible delete.
                    - secretsmanager:DeleteSecret
                    # restore_secrets_manager_secret -- the undo, clearing
                    # the pending-deletion marker within the recovery window.
                    - secretsmanager:RestoreSecret
                  Resource: "arn:aws:secretsmanager:*:*:secret:*"

    # -------------------------
    # SQS — notifications
    # -------------------------
    NotificationsQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-notifications-dlq
        MessageRetentionPeriod: 1209600  # 14 days
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}

    NotificationsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-notifications-queue
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [NotificationsQueueDLQ, Arn]
          maxReceiveCount: 3
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}

    # -------------------------
    # SQS — responses (IR actions)
    # -------------------------
    ResponsesQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-responses-dlq
        MessageRetentionPeriod: 1209600  # 14 days
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}

    ResponsesQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-responses-queue
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [ResponsesQueueDLQ, Arn]
          maxReceiveCount: 3
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}

    # -------------------------
    # SQS — IR rollback. Separate from ResponsesQueue -- api.py's
    # POST /ir-actions/{id}/rollback enqueues here, rollbackHandler
    # consumes it, mirroring the processor -> outbox -> responder shape
    # rather than calling dredge synchronously from the API Lambda.
    # -------------------------
    IrRollbackQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-ir-rollback-dlq
        MessageRetentionPeriod: 1209600  # 14 days
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}

    IrRollbackQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-ir-rollback-queue
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [IrRollbackQueueDLQ, Arn]
          maxReceiveCount: 3
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}

    # -------------------------
    # SQS — signals write buffer (decouples burst writes from
    # signals-table-v2's per-partition throughput ceiling; see the
    # SIGNALS TABLE V2 comment above. Scoped to signals-table only, not
    # logs-table -- logs-table already degrades gracefully, see
    # docs/data-archival.md and src/infra/logger.py's _log().)
    # -------------------------
    SignalsWriteQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-signals-write-dlq
        MessageRetentionPeriod: 1209600  # 14 days
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}

    SignalsWriteQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-signals-write-queue
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [SignalsWriteQueueDLQ, Arn]
          maxReceiveCount: 3
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}

    # -------------------------
    # SQS — stream failure sink (poison-pill DLQ for DynamoDB streams)
    # -------------------------
    StreamFailureQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-stream-failures
        MessageRetentionPeriod: 1209600  # 14 days
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}

    # -------------------------
    # SNS — alarms topic (subscribe via CLI after deploy)
    # -------------------------
    AlarmsSnsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${self:provider.stage}-alarms
        DisplayName: OpenCDR Alarms
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}

    AlarmsEmailSubscription:
      Type: AWS::SNS::Subscription
      Condition: HasAlarmEmail
      Properties:
        TopicArn: !Ref AlarmsSnsTopic
        Protocol: email
        Endpoint: "${param:alarmEmail}"

    # -------------------------
    # AWS Budgets requires an explicit resource policy granting
    # budgets.amazonaws.com permission to publish -- unlike CloudWatch
    # alarm actions, this is not implicitly allowed same-account.
    # Reuses AlarmsSnsTopic (-> alarmNotifier -> Slack) rather than
    # provisioning a second topic/subscriber path for the same purpose.
    # -------------------------
    AlarmsSnsTopicPolicy:
      Type: AWS::SNS::TopicPolicy
      Properties:
        Topics:
          - !Ref AlarmsSnsTopic
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowBudgetsPublish
              Effect: Allow
              Principal:
                Service: budgets.amazonaws.com
              Action: sns:Publish
              Resource: !Ref AlarmsSnsTopic
              Condition:
                StringEquals:
                  AWS:SourceAccount: !Ref AWS::AccountId

    # -------------------------
    # Cost budget -- scoped to this stack's own tagged resources (Project/
    # Stage), not the whole account, so it reflects what OpenCDR itself
    # costs to run. Amount is a deploy-time param (params.monthlyBudgetUsd)
    # rather than hardcoded, since this is expected to vary a lot by
    # traffic/client and shouldn't require a serverless.yml edit to change.
    # First deploy attempt confirmed the SNS/notification wiring below is
    # correct; it failed on CostFilters' tag-key-value syntax specifically
    # -- "user:Stage$${self:provider.stage}" resolved to "user:Stagedev",
    # Serverless Framework's variable resolver silently ate the literal "$"
    # sitting directly next to a ${...} interpolation. Fixed with Fn::Join:
    # the stage is resolved as a normal, already-proven-safe standalone
    # ${self:provider.stage} reference (used everywhere else in this file),
    # then CloudFormation joins it with the literal "$" delimiter at deploy
    # time -- no Serverless-Framework-level $ escaping involved at all.
    # -------------------------
    CostBudget:
      Type: AWS::Budgets::Budget
      DependsOn: AlarmsSnsTopicPolicy
      Properties:
        Budget:
          BudgetName: ${self:service}-${self:provider.stage}-monthly-cost
          BudgetType: COST
          TimeUnit: MONTHLY
          BudgetLimit:
            Amount: ${param:monthlyBudgetUsd}
            Unit: USD
          CostFilters:
            TagKeyValue:
              - user:Project$opencdr
              - Fn::Join:
                  - "$"
                  - - "user:Stage"
                    - "${self:provider.stage}"
        NotificationsWithSubscribers:
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 80
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: SNS
                Address: !Ref AlarmsSnsTopic
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: SNS
                Address: !Ref AlarmsSnsTopic
          - Notification:
              NotificationType: FORECASTED
              ComparisonOperator: GREATER_THAN
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: SNS
                Address: !Ref AlarmsSnsTopic

    # -------------------------
    # SNS — alerts topic (security detection notifications)
    # -------------------------
    AlertsSnsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${self:provider.stage}-alerts
        DisplayName: OpenCDR Security Alerts
        Tags:
          - Key: Project
            Value: opencdr
          - Key: Stage
            Value: ${self:provider.stage}

    AlertsEmailSubscription:
      Type: AWS::SNS::Subscription
      Condition: HasAlertEmail
      Properties:
        TopicArn: !Ref AlertsSnsTopic
        Protocol: email
        Endpoint: "${param:alertEmail}"

    # -------------------------
    # CloudWatch Alarms — Lambda errors (one per function)
    # -------------------------
    AlarmProcessorErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-processor-errors
        AlarmDescription: "processor Lambda error count > 0"
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: !Ref ProcessorLambdaFunction
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    AlarmAlerterErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-alerter-errors
        AlarmDescription: "alerter Lambda error count > 0"
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: !Ref AlerterLambdaFunction
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    AlarmPublisherErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-publisher-errors
        AlarmDescription: "publisher Lambda error count > 0"
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: !Ref PublisherLambdaFunction
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    AlarmNotifierErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-notifier-errors
        AlarmDescription: "notifier Lambda error count > 0"
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: !Ref NotifierLambdaFunction
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    AlarmResponderErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-responder-errors
        AlarmDescription: "responder Lambda error count > 0"
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: !Ref ResponderLambdaFunction
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    AlarmApiErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-api-errors
        AlarmDescription: "api Lambda error count > 0"
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: !Ref ApiLambdaFunction
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    AlarmArchiverErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-archiver-errors
        AlarmDescription: "archiver Lambda error count > 0"
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: !Ref ArchiverLambdaFunction
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    AlarmSignalWriterErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-signal-writer-errors
        AlarmDescription: "signalWriter Lambda error count > 0"
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: !Ref SignalWriterLambdaFunction
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    # Tripwire for the "logs-table doesn't need an SQS write-buffer"
    # decision (see the SQS — signals write buffer comment above) --
    # logs-table relies on its own graceful CloudWatch-first degradation
    # plus the service_bucket partition-key fix instead of a buffer. If
    # this ever fires, that decision needs revisiting.
    AlarmLogsTableThrottled:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-logs-table-throttled
        AlarmDescription: "logs-table-v2 write throttling detected"
        Namespace: AWS/DynamoDB
        MetricName: ThrottledRequests
        Dimensions:
          - Name: TableName
            Value: !Ref LogsTableV2
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    # -------------------------
    # CloudWatch Alarms — DLQ depth
    # -------------------------
    AlarmNotificationsDLQDepth:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-notifications-dlq-depth
        AlarmDescription: "Messages visible in notifications DLQ > 0"
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt NotificationsQueueDLQ.QueueName
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    AlarmResponsesDLQDepth:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-responses-dlq-depth
        AlarmDescription: "Messages visible in responses DLQ > 0"
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt ResponsesQueueDLQ.QueueName
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    AlarmSignalsWriteDLQDepth:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-signals-write-dlq-depth
        AlarmDescription: "Messages visible in signals write DLQ > 0"
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt SignalsWriteQueueDLQ.QueueName
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    AlarmStreamFailureQueueDepth:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-stream-failures-depth
        AlarmDescription: "Messages visible in stream failure queue > 0"
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt StreamFailureQueue.QueueName
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    # -------------------------
    # CloudWatch Alarms — DynamoDB stream iterator age
    # -------------------------
    AlarmAlerterIteratorAge:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-alerter-iterator-age
        AlarmDescription: "alerter stream iterator age > 5 min — consumer falling behind"
        Namespace: AWS/Lambda
        MetricName: IteratorAge
        Dimensions:
          - Name: FunctionName
            Value: !Ref AlerterLambdaFunction
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 300000
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    AlarmPublisherIteratorAge:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-publisher-iterator-age
        AlarmDescription: "publisher stream iterator age > 5 min — consumer falling behind"
        Namespace: AWS/Lambda
        MetricName: IteratorAge
        Dimensions:
          - Name: FunctionName
            Value: !Ref PublisherLambdaFunction
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 300000
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    # archiver has 3 event source mappings (signals/alerts/logs streams),
    # but AWS/Lambda's IteratorAge metric is dimensioned by FunctionName
    # only, not per-event-source-mapping -- this alarm fires if ANY of
    # the three falls behind, without saying which one. Check the
    # archiver Lambda's own recent invocations/logs to narrow it down.
    AlarmArchiverIteratorAge:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-archiver-iterator-age
        AlarmDescription: "archiver stream iterator age > 5 min (signals/alerts/logs streams) — consumer falling behind"
        Namespace: AWS/Lambda
        MetricName: IteratorAge
        Dimensions:
          - Name: FunctionName
            Value: !Ref ArchiverLambdaFunction
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 300000
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlarmsSnsTopic

    # -------------------------
    # CloudWatch Dashboard
    # -------------------------
    OpsDashboard:
      Type: AWS::CloudWatch::Dashboard
      Properties:
        DashboardName: ${self:service}-${self:provider.stage}-ops
        DashboardBody:
          Fn::Sub: |
            {
              "widgets": [
                {
                  "type": "metric",
                  "x": 0, "y": 0, "width": 12, "height": 6,
                  "properties": {
                    "title": "Lambda Errors",
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${AWS::Region}",
                    "stat": "Sum",
                    "period": 60,
                    "metrics": [
                      ["AWS/Lambda", "Errors", "FunctionName", "${ProcessorLambdaFunction}", {"label": "processor"}],
                      ["AWS/Lambda", "Errors", "FunctionName", "${AlerterLambdaFunction}", {"label": "alerter"}],
                      ["AWS/Lambda", "Errors", "FunctionName", "${PublisherLambdaFunction}", {"label": "publisher"}],
                      ["AWS/Lambda", "Errors", "FunctionName", "${NotifierLambdaFunction}", {"label": "notifier"}],
                      ["AWS/Lambda", "Errors", "FunctionName", "${ResponderLambdaFunction}", {"label": "responder"}],
                      ["AWS/Lambda", "Errors", "FunctionName", "${ApiLambdaFunction}", {"label": "api"}],
                      ["AWS/Lambda", "Errors", "FunctionName", "${AlarmNotifierLambdaFunction}", {"label": "alarmNotifier"}],
                      ["AWS/Lambda", "Errors", "FunctionName", "${ArchiverLambdaFunction}", {"label": "archiver"}],
                      ["AWS/Lambda", "Errors", "FunctionName", "${SignalWriterLambdaFunction}", {"label": "signalWriter"}]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 12, "y": 0, "width": 12, "height": 6,
                  "properties": {
                    "title": "Lambda p99 Duration (ms)",
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${AWS::Region}",
                    "stat": "p99",
                    "period": 60,
                    "metrics": [
                      ["AWS/Lambda", "Duration", "FunctionName", "${ProcessorLambdaFunction}", {"label": "processor"}],
                      ["AWS/Lambda", "Duration", "FunctionName", "${AlerterLambdaFunction}", {"label": "alerter"}],
                      ["AWS/Lambda", "Duration", "FunctionName", "${PublisherLambdaFunction}", {"label": "publisher"}],
                      ["AWS/Lambda", "Duration", "FunctionName", "${NotifierLambdaFunction}", {"label": "notifier"}],
                      ["AWS/Lambda", "Duration", "FunctionName", "${ResponderLambdaFunction}", {"label": "responder"}],
                      ["AWS/Lambda", "Duration", "FunctionName", "${ApiLambdaFunction}", {"label": "api"}],
                      ["AWS/Lambda", "Duration", "FunctionName", "${AlarmNotifierLambdaFunction}", {"label": "alarmNotifier"}],
                      ["AWS/Lambda", "Duration", "FunctionName", "${ArchiverLambdaFunction}", {"label": "archiver"}],
                      ["AWS/Lambda", "Duration", "FunctionName", "${SignalWriterLambdaFunction}", {"label": "signalWriter"}]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 0, "y": 6, "width": 12, "height": 6,
                  "properties": {
                    "title": "Lambda Invocations",
                    "view": "timeSeries",
                    "stacked": true,
                    "region": "${AWS::Region}",
                    "stat": "Sum",
                    "period": 60,
                    "metrics": [
                      ["AWS/Lambda", "Invocations", "FunctionName", "${ProcessorLambdaFunction}", {"label": "processor"}],
                      ["AWS/Lambda", "Invocations", "FunctionName", "${AlerterLambdaFunction}", {"label": "alerter"}],
                      ["AWS/Lambda", "Invocations", "FunctionName", "${PublisherLambdaFunction}", {"label": "publisher"}],
                      ["AWS/Lambda", "Invocations", "FunctionName", "${NotifierLambdaFunction}", {"label": "notifier"}],
                      ["AWS/Lambda", "Invocations", "FunctionName", "${ResponderLambdaFunction}", {"label": "responder"}],
                      ["AWS/Lambda", "Invocations", "FunctionName", "${ApiLambdaFunction}", {"label": "api"}],
                      ["AWS/Lambda", "Invocations", "FunctionName", "${AlarmNotifierLambdaFunction}", {"label": "alarmNotifier"}],
                      ["AWS/Lambda", "Invocations", "FunctionName", "${ArchiverLambdaFunction}", {"label": "archiver"}],
                      ["AWS/Lambda", "Invocations", "FunctionName", "${SignalWriterLambdaFunction}", {"label": "signalWriter"}]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 12, "y": 6, "width": 12, "height": 6,
                  "properties": {
                    "title": "Queue Depth (DLQs + stream failures)",
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${AWS::Region}",
                    "stat": "Maximum",
                    "period": 60,
                    "metrics": [
                      ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${NotificationsQueueDLQ.QueueName}", {"label": "notifications-dlq"}],
                      ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ResponsesQueueDLQ.QueueName}", {"label": "responses-dlq"}],
                      ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${StreamFailureQueue.QueueName}", {"label": "stream-failures"}],
                      ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${SignalsWriteQueueDLQ.QueueName}", {"label": "signals-write-dlq"}]
                    ]
                  }
                },
                {
                  "type": "metric",
                  "x": 0, "y": 12, "width": 24, "height": 6,
                  "properties": {
                    "title": "Detections & Publishing (custom metrics)",
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${AWS::Region}",
                    "period": 60,
                    "metrics": [
                      [{"expression": "SEARCH('{OpenCDR,rule_id,severity} MetricName=\"SignalsCreated\"', 'Sum', 60)", "label": "SignalsCreated", "id": "e1"}],
                      [{"expression": "SEARCH('{OpenCDR,rule_id} MetricName=\"CorrelationMatches\"', 'Sum', 60)", "label": "CorrelationMatches", "id": "e2"}],
                      [{"expression": "SEARCH('{OpenCDR,destination} MetricName=\"PublishSuccess\"', 'Sum', 60)", "label": "PublishSuccess", "id": "e3"}],
                      [{"expression": "SEARCH('{OpenCDR,destination} MetricName=\"PublishFailure\"', 'Sum', 60)", "label": "PublishFailure", "id": "e4"}],
                      [{"expression": "SEARCH('{OpenCDR,response_module,result} MetricName=\"ResponderActionsExecuted\"', 'Sum', 60)", "label": "ResponderActionsExecuted", "id": "e5"}]
                    ]
                  }
                }
              ]
            }

    # -------------------------
    # Cross-region event forwarding (receiving side)
    #
    # processor's EventBridge rule above only exists on this stack's own
    # default bus, in this stack's own region -- CloudTrail delivers events
    # to the bus in whichever region the API call actually happened in
    # (true even for a multi-region trail; the only exception is global
    # services like IAM/STS, always us-east-1), and GuardDuty detectors are
    # inherently per-region. An account operating in more than one region
    # is otherwise silently blind everywhere except this one.
    #
    # This role + bus policy is the receiving half: it lets a forwarding
    # rule deployed separately in each additional region (see
    # region-forwarding/cross-region-forwarder.yaml, applied via
    # scripts/setup_region_forwarding.sh -- a `serverless deploy` in this
    # region can't provision a rule in another region, same reason
    # additional-account IR roles need their own manual step, see
    # docs/ir-role.md) send its region's CloudTrail/GuardDuty events here.
    # Opt-in per region, not automatic -- see docs/region-forwarding.md.
    # -------------------------
    RegionForwarderRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-region-forwarder
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: put-events-to-home-bus
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - events:PutEvents
                  Resource:
                    - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"

    RegionForwarderBusPolicy:
      Type: AWS::Events::EventBusPolicy
      Properties:
        EventBusName: default
        StatementId: ${self:service}-${self:provider.stage}-allow-region-forwarding
        Statement:
          Effect: Allow
          Principal:
            AWS: !GetAtt RegionForwarderRole.Arn
          Action: events:PutEvents
          Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"

    # -------------------------
    # ORG-WIDE ACCOUNT FORWARDING (opt-in: only created if orgId is set)
    # -------------------------
    # Scoped replacement for the org-wide deployment recipe that used to
    # live only in README.md prose: `aws events put-permission --principal
    # "*" --condition PrincipalOrgID`. That grants events:PutEvents to
    # *any* principal anywhere in the org -- not just the intended
    # per-account forwarding mechanism -- so any credential in any member
    # account (a compromised Lambda, an over-permissioned app role, an
    # insider) could call PutEvents directly and hand processor a
    # hand-crafted, CloudTrail-shaped event indistinguishable from a real
    # one. Once a signal-triggered response action can actually resolve
    # its target correctly (see the extractor fix elsewhere this
    # session), that forged event can direct real automated response at
    # a target of the forger's choosing via crafted requestParameters.
    #
    # Fixed the same way RegionForwarderRole/RegionForwarderBusPolicy
    # restrict region-forwarding to one specific role's ARN, extended to
    # cross-account: a StringLike condition on aws:PrincipalArn, matching
    # only the specific per-account forwarder role name
    # (org-forwarding/account-event-forwarder.yaml, applied once per
    # member account -- IAM roles are account-scoped, so unlike
    # RegionForwarderRole this can't be created once and reused). That
    # role's own trust policy only lets events.amazonaws.com assume it --
    # no human or application credential can call sts:AssumeRole on it
    # directly, so forging an event now requires either compromising that
    # specific role (not directly assumable by anything but EventBridge
    # itself) or standing up your own same-named role and wiring your own
    # rule to it, which is "I'm already an account admin building my own
    # forwarding infra" -- a fundamentally different, already-trusted
    # threat model. See docs/org-forwarding.md.
    OrgForwarderBusPolicy:
      Type: AWS::Events::EventBusPolicy
      Condition: HasOrgId
      Properties:
        EventBusName: default
        StatementId: ${self:service}-${self:provider.stage}-allow-org-account-forwarding
        Statement:
          Effect: Allow
          Principal: "*"
          Action: events:PutEvents
          Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
          Condition:
            StringEquals:
              aws:PrincipalOrgID: "${param:orgId}"
            StringLike:
              aws:PrincipalArn: !Sub "arn:aws:iam::*:role/${self:service}-${self:provider.stage}-account-forwarder-role"

  Outputs:
    AlarmsTopicArn:
      Description: "SNS topic ARN for CloudWatch alarms — subscribe to receive notifications"
      Value: !Ref AlarmsSnsTopic
    AlertsTopicArn:
      Description: "SNS topic ARN for security detection alerts — subscribe to receive email notifications"
      Value: !Ref AlertsSnsTopic
    DashboardUrl:
      Description: "CloudWatch Dashboard for Lambda health, queue depth, and detection/publishing metrics"
      Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${OpsDashboard}"
    RegionForwarderRoleArn:
      Description: "IAM role ARN a per-region forwarding rule (region-forwarding/cross-region-forwarder.yaml) assumes to send events here -- see docs/region-forwarding.md"
      Value: !GetAtt RegionForwarderRole.Arn
    DefaultEventBusArn:
      Description: "This region's default EventBridge bus ARN -- the forwarding target for additional-region rules (docs/region-forwarding.md) and, for an org-wide deployment, for each member account's forwarder too (docs/org-forwarding.md)"
      Value: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
    OrgAccountForwarderRoleName:
      Description: "The exact role name org-forwarding/account-event-forwarder.yaml must create in every member account -- OrgForwarderBusPolicy only trusts principals matching this name pattern. Only meaningful if orgId was set at deploy time. See docs/org-forwarding.md"
      Value: ${self:service}-${self:provider.stage}-account-forwarder-role


plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false
    pythonBin: python3
    slim: true

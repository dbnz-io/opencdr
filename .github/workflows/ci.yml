name: OpenCDR CI

# This is the public repo's own CI -- validation, tests, and static
# analysis only. Deliberately does NOT include a deploy/release pipeline:
# this repo is a released artifact, not a live deployment target, and a
# `deploy` job triggered by every merged PR would mean anyone who can get
# a PR merged here can trigger a real AWS deployment somewhere -- too
# large a trust surface for a public repo where anyone can open a PR.
#
# To deploy your own instance: see the root README's Deployment section
# and docs/deployment.md. ci-bootstrap/ is the reference template for
# wiring your own CI/CD (OIDC deploy role, no long-lived AWS keys) against
# your own AWS account.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rules:
    name: Validate Detection Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # support_files/detection_rules is a submodule (dbnz-io/opencdr-detection-
      # rules, public) -- without submodules: true this checks out empty and
      # the step below would silently validate zero rules.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - name: Validate rules and reusable lists against the runtime contracts
        run: python3 scripts/validate_catalog.py support_files/detection_rules

  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}" \
            --output "$ARCHIVE"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${ARCHIVE}" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm "$ARCHIVE"

      - name: Scan working tree for secrets
        run: gitleaks detect --source . --no-git --verbose --redact

      - name: Reject tracked local credentials and generated packages
        run: |
          forbidden=$(git ls-files | grep -E '^(\.opencdr\.json|\.requirements\.zip|\.serverless/)' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Forbidden credential/build artifacts are tracked:"
            echo "$forbidden"
            exit 1
          fi

  node-supply-chain:
    name: Node Build-Chain Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install exactly the locked build toolchain
        run: npm ci

      - name: Audit the build toolchain
        run: npm audit --audit-level=high

  python-quality:
    name: Python Quality and SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the locked quality toolchain
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check src tests scripts mcp_server
          ruff format --check src tests scripts mcp_server

      - name: Type check
        run: mypy src

      - name: Run bandit
        run: bandit -r src/ -ll -ii

  # No sbom job here -- an SBOM tied to a rolling `main` push and expiring
  # after 90 days isn't the useful artifact. Two better things exist
  # instead: GitHub's own Insights -> Dependency graph -> Export SBOM
  # button (always current, zero maintenance), and a permanent,
  # version-tagged SBOM attached as a release asset on every GitHub
  # Release -- generated in tag-release.yml, at tag time, so it reflects
  # exactly what that version shipped.

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [validate-rules, secrets-scan, node-supply-chain, python-quality]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # tests/domain/test_guardduty_rules.py and
      # tests/integration/test_golden_path_pipeline.py read real rule JSON
      # from the detection-rules submodule -- without submodules: true it
      # checks out empty and both suites fail on missing rules.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Audit locked Python runtime dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip_audit -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml

      # Generated as a downloadable artifact, not committed to main --
      # main is branch-protected (PR review required), and a direct
      # `git push` from this job would fail every time against that
      # protection. Grab the artifact from a completed run and commit it
      # by hand (or via a PR) if you want the badge to actually update in
      # the README.
      - name: Generate coverage badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        run: |
          genbadge coverage -i coverage.xml -o coverage-badge.svg

      - name: Upload coverage badge artifact
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-badge
          path: coverage-badge.svg
          retention-days: 90

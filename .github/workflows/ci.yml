name: OpenCDR CI

# This is the public repo's own CI -- validation, tests, and static
# analysis only. Deliberately does NOT include a deploy/release pipeline:
# this repo is a released artifact, not a live deployment target, and a
# `deploy` job triggered by every merged PR would mean anyone who can get
# a PR merged here can trigger a real AWS deployment somewhere -- too
# large a trust surface for a public repo where anyone can open a PR.
#
# To deploy your own instance: see the root README's Deployment section
# and docs/deployment.md. ci-bootstrap/ is the reference template for
# wiring your own CI/CD (OIDC deploy role, no long-lived AWS keys) against
# your own AWS account.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rules:
    name: Validate Detection Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JSON syntax and required fields
        run: |
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path

          RULE_REQUIRED_FIELDS = ("rule_id", "rule_kind", "severity", "enabled")
          LIST_REQUIRED_FIELDS = ("rule_id", "rule_kind", "values")
          rule_dir = Path("support_files/detection_rules")
          paths = sorted(rule_dir.glob("*.json"))

          if not paths:
              print("WARNING: no rule files found", file=sys.stderr)
              sys.exit(0)

          errors = []
          for path in paths:
              try:
                  rule = json.loads(path.read_text())
              except json.JSONDecodeError as exc:
                  errors.append(f"{path.name}: invalid JSON — {exc}")
                  continue
              if rule.get("rule_kind") == "list":
                  for field in LIST_REQUIRED_FIELDS:
                      if field not in rule:
                          errors.append(f"{path.name}: missing required field '{field}'")
                  if "values" in rule and not isinstance(rule["values"], list):
                      errors.append(f"{path.name}: 'values' must be an array")
              else:
                  for field in RULE_REQUIRED_FIELDS:
                      if field not in rule:
                          errors.append(f"{path.name}: missing required field '{field}'")

          if errors:
              for msg in errors:
                  print(f"ERROR: {msg}", file=sys.stderr)
              sys.exit(1)

          print(f"All {len(paths)} rule(s) passed validation.")
          EOF

  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks
        run: |
          VERSION=$(curl -sL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d '"' -f4 | sed 's/^v//')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      - name: Scan working tree for secrets
        run: gitleaks detect --source . --no-git --verbose --redact

  python-sast:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r src/ -ll -ii

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Export SBOM from GitHub's dependency graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "/repos/${{ github.repository }}/dependency-graph/sbom" > sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [validate-rules]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml

      # Generated as a downloadable artifact, not committed to main --
      # main is branch-protected (PR review required), and a direct
      # `git push` from this job would fail every time against that
      # protection. Grab the artifact from a completed run and commit it
      # by hand (or via a PR) if you want the badge to actually update in
      # the README.
      - name: Generate coverage badge
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        run: |
          pip install genbadge[coverage]
          genbadge coverage -i coverage.xml -o coverage-badge.svg

      - name: Upload coverage badge artifact
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-badge
          path: coverage-badge.svg
          retention-days: 90

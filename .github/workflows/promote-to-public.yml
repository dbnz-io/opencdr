name: Promote to Public Repo

# Manual, on-demand promotion of this repo's current main to the public
# dbnz-io/opencdr repo -- deliberately NOT triggered by push/deploy/release
# the way ci.yml's own `release` job is. Public releases are a separate,
# deliberate decision from "this internal dev-stage deploy succeeded."
#
# Clean-slate by design: builds a filtered tree via `git archive` (respects
# .gitattributes' export-ignore markers -- see that file for exactly what's
# excluded and why) and pushes it as a *new commit* to the public repo, not
# this repo's real git history. Nothing here ever exposes opencdr-internal's
# commit history -- including the dead API key that's still sitting in it
# (confirmed not live, see CHANGELOG/git history) -- to the public repo.
#
# Versioning is independent of this repo's own internal version series:
# the public repo starts its own at v1.0.0, set via the `version` input.
#
# One-time setup required before this can push anything for real -- see
# docs/promoting-to-public.md: a fine-grained PAT scoped only to
# dbnz-io/opencdr (Contents: Read and write) stored as the
# OPENCDR_PUBLIC_REPO_TOKEN secret in *this* repo.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Public release version, SemVer with a leading v (e.g. v1.0.0) -- independent of this repo's own internal versioning"
        required: true
      release_notes:
        description: "Public-facing release notes (Markdown) -- written fresh for this release, not pulled from this repo's own CHANGELOG.md"
        required: true
      dry_run:
        description: "Build and validate the promotion tree without pushing anything to the public repo"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  promote:
    name: Promote to dbnz-io/opencdr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version must be SemVer with a leading v, e.g. v1.0.0 (got: '${{ inputs.version }}')"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Hard gate, re-run explicitly here rather than trusting that main's
      # own CI already passed -- this is a deliberate, consequential, human-
      # triggered action, and deserves its own verification, not inherited
      # trust in an upstream job that ran at some earlier, different time.
      - name: Run full test suite
        run: pytest tests/ -v --cov=src

      - name: Install gitleaks
        run: |
          VERSION=$(curl -sL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d '"' -f4 | sed 's/^v//')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

      # Hard gate here specifically -- ci.yml's own gitleaks job is
      # continue-on-error (a PR-gating trip-wire, not a release blocker).
      # Publishing a secret to a public repo is a different order of
      # consequence than merging one to a private repo's working tree.
      - name: Scan working tree for secrets
        run: gitleaks detect --source . --no-git --verbose --redact

      - name: Build promotion tree
        run: |
          set -euo pipefail
          STAGING="$(mktemp -d)"
          git archive HEAD | tar -x -C "$STAGING"
          echo "Files to be promoted: $(find "$STAGING" -type f | wc -l)"
          echo "STAGING_DIR=$STAGING" >> "$GITHUB_ENV"

      - name: Preview promotion tree (dry run only)
        if: ${{ inputs.dry_run }}
        run: |
          echo "Top-level contents that would be promoted to dbnz-io/opencdr:"
          ls -la "$STAGING_DIR"
          echo ""
          echo "DRY RUN -- nothing was pushed. Re-run with dry_run=false to actually promote."

      - name: Checkout public repo
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@v4
        with:
          repository: dbnz-io/opencdr
          token: ${{ secrets.OPENCDR_PUBLIC_REPO_TOKEN }}
          path: public-repo
          fetch-depth: 0

      - name: Refuse to overwrite an existing tag
        if: ${{ !inputs.dry_run }}
        run: |
          cd public-repo
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "ERROR: tag ${{ inputs.version }} already exists on dbnz-io/opencdr. Choose a new version."
            exit 1
          fi

      - name: Replace public repo tree and commit
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          cd public-repo
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$STAGING_DIR"/. ./
          git config user.name "opencdr-promotion-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${{ inputs.version }}

          Promoted from opencdr-internal @ ${GITHUB_SHA}
          (source commit reference only -- opencdr-internal's own git
          history is never pushed here)" --allow-empty
          git tag -a "${{ inputs.version }}" -m "${{ inputs.version }}"

      - name: Push and create release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.OPENCDR_PUBLIC_REPO_TOKEN }}
        run: |
          cd public-repo
          git push origin HEAD:main
          git push origin "${{ inputs.version }}"
          gh release create "${{ inputs.version }}" \
            --repo dbnz-io/opencdr \
            --title "${{ inputs.version }}" \
            --notes "${{ inputs.release_notes }}"

  /ir-roles/{aws_account_id}:
    parameters:
      - in: path
        name: aws_account_id
        required: true
        schema: { type: string, pattern: "^[0-9]{12}$" }
    get:
      summary: Get the IR-role mapping for an account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IRRole" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Upsert the IR-role mapping for an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IRRole" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IRRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      summary: Delete the IR-role mapping for an account
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /ir-actions:
    get:
      summary: List executed, rollback-eligible IR actions
      parameters:
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/NextToken" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IRActionListResponse" }

  /ir-actions/{detection_id}:
    parameters:
      - { in: path, name: detection_id, required: true, schema: { type: string } }
    get:
      summary: Get a specific executed IR action
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IRAction" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ir-actions/{detection_id}/rollback:
    parameters:
      - { in: path, name: detection_id, required: true, schema: { type: string } }
    post:
      summary: Enqueue the rollback of an IR action (async; returns 202)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RollbackRequest" }
      responses:
        "202":
          description: Rollback enqueued (poll GET /ir-actions/{detection_id} for the outcome)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Rollback not supported for this action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A rollback for this action is already pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

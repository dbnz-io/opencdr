        "409": { $ref: "#/components/responses/Conflict" }

  /settings/{setting_id}:
    parameters:
      - { in: path, name: setting_id, required: true, schema: { type: string } }
    get:
      summary: Get a settings document by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Upsert a settings document (optional optimistic concurrency)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsWrite" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Delete a settings document
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /ir-roles:
    get:
      summary: List IR-role mappings
      parameters:
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/NextToken" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IRRoleListResponse" }
    post:
      summary: Create an IR-role mapping (conditional -- 409 if it exists)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IRRole" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IRRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

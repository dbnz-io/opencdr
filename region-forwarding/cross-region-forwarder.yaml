AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OpenCDR Core regional collector. Forwards matching CloudTrail and GuardDuty
  events from one additional region to the account-local home region. Deploy
  once per enabled region through scripts/setup_region_forwarding.sh.

Parameters:
  ServiceName:
    Type: String
    Default: opencdr
  Stage:
    Type: String
    Default: dev
  HomeEventBusArn:
    Type: String
    Description: >
      The home region's default event bus ARN -- the
      `DefaultEventBusArn` output from the main serverless.yml stack.
  HomeForwarderRoleArn:
    Type: String
    Description: >
      The IAM role this rule assumes to call PutEvents on the home bus --
      the `RegionForwarderRoleArn` output from the main serverless.yml
      stack. Not created here: IAM roles aren't region-scoped, and
      creating one per region under the same name would collide.

Resources:
  ForwardingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ServiceName}-${Stage}-region-forwarder-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ForwardingRule:
    Type: AWS::Events::Rule
    DependsOn: ForwardingDeadLetterQueuePolicy
    Properties:
      Name: !Sub "${ServiceName}-${Stage}-region-forwarder"
      Description: !Sub "Forwards this region's CloudTrail/GuardDuty events to ${HomeEventBusArn}"
      EventBusName: default
      State: ENABLED
      EventPattern:
        source:
          - "aws.guardduty"
          - "aws.signin"
          - "aws.iam"
          - "aws.sts"
          - "aws.lambda"
          - "aws.ec2"
          - "aws.cloudtrail"
          - "aws.config"
          - "aws.securityhub"
          - "aws.secretsmanager"
          - "aws.ssm"
          - "aws.s3"
          - "aws.rds"
        detail-type:
          - "GuardDuty Finding"
          - "AWS API Call via CloudTrail"
          - "AWS Console Sign In via CloudTrail"
      Targets:
        - Id: HomeRegionBus
          Arn: !Ref HomeEventBusArn
          RoleArn: !Ref HomeForwarderRoleArn
          RetryPolicy:
            MaximumEventAgeInSeconds: 86400
            MaximumRetryAttempts: 185
          DeadLetterConfig:
            Arn: !GetAtt ForwardingDeadLetterQueue.Arn

  ForwardingDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ForwardingDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeRule
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ForwardingDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${ServiceName}-${Stage}-region-forwarder"

  ForwardingFailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ServiceName}-${Stage}-${AWS::Region}-region-forwarder-failed"
      AlarmDescription: "OpenCDR Core regional collector permanently failed to deliver an event"
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref ForwardingRule
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ForwardingDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ServiceName}-${Stage}-${AWS::Region}-region-forwarder-dlq"
      AlarmDescription: "OpenCDR Core regional collector has undelivered events in its DLQ"
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ForwardingDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ForwardingRuleArn:
    Value: !GetAtt ForwardingRule.Arn
  ForwardingDeadLetterQueueArn:
    Value: !GetAtt ForwardingDeadLetterQueue.Arn
  ForwardingDeadLetterQueueUrl:
    Value: !Ref ForwardingDeadLetterQueue
  ForwardingFailedInvocationsAlarmName:
    Value: !Ref ForwardingFailedInvocationsAlarm
  ForwardingDeadLetterQueueAlarmName:
    Value: !Ref ForwardingDeadLetterQueueAlarm

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ocdr"
version = "1.1.3"
description = "OpenCDR Core — account-local Cloud Detection & Response for AWS"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "requests>=2.32.0",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
    "typing_extensions>=4.10.0",
]

[project.urls]
Repository = "https://github.com/dbnz-io/opencdr"
Issues = "https://github.com/dbnz-io/opencdr/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = true

[tool.setuptools.package-data]
"src.openapi" = ["*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
